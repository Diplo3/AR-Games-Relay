<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#20183f"><title>Кто ближе? · Игрок</title>
<style>
:root{color-scheme:dark;--bg:#17132e;--panel:#262147;--panel2:#302a55;--edge:#71659a;--text:#f7f4ff;--muted:#c6bbee;--accent:#c8b2ff;--accent2:#9e80ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#3c2e69,#17132e 68%);color:var(--text);font:16px/1.45 "Segoe UI",Arial,sans-serif;min-height:100dvh}.app{max-width:520px;min-height:100dvh;margin:auto;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom);display:flex;flex-direction:column}.head{text-align:center;padding:22px 10px 12px;border-bottom:1px solid #71659a88}.head strong{font-size:19px;letter-spacing:.03em}.head small{display:block;color:var(--muted);letter-spacing:.14em;font-size:10px;margin-top:3px}main{flex:1;padding:24px 2px 20px}h1{font-size:26px;line-height:1.18;margin:8px 0 22px;text-align:center}h2{text-align:center;font-size:18px;margin:8px 0;color:var(--muted)}p{text-align:center;color:var(--muted)}.status{color:var(--muted);text-align:center;font-size:13px;margin:0 0 20px}.teams,.options{display:grid;gap:10px}.teams button,.options button,button.primary{min-height:54px;background:linear-gradient(140deg,var(--panel2),var(--panel));border:1px solid var(--edge);border-radius:13px;color:var(--text);font:600 16px inherit;padding:12px 16px;text-align:left}.teams button.selected,.options button.selected{border-color:var(--accent);background:linear-gradient(140deg,#59498a,#332b59);box-shadow:0 0 0 1px #c8b2ff55}.options button{font-size:18px;text-align:center}.teams button:disabled,.options button:disabled,button:disabled{opacity:.55}.field{display:block;margin:12px 0}.field input{width:100%;height:56px;border:1px solid var(--edge);border-radius:12px;background:#17132e;color:var(--text);padding:12px 16px;font-size:20px}.primary{width:100%;margin-top:15px;text-align:center!important;background:linear-gradient(110deg,var(--accent),var(--accent2))!important;border-color:transparent!important;color:#21183e!important}.error{color:#ffb6bd;min-height:1.5em;text-align:center}.answered{border:1px solid var(--edge);border-radius:14px;background:#201b3e;padding:18px;text-align:center}.answered b{display:block;margin-bottom:6px;color:var(--accent)}[hidden]{display:none!important}
</style><script src="./connect.js"></script>
</head><body><div class="app"><header class="head"><strong>КТО БЛИЖЕ?</strong><small>ИГРА С ТЕЛЕФОНОМ</small></header><main id="app"><p class="status">Подключаемся к игре…</p></main></div><script src="./kto-blizhe.js"></script></body></html>
