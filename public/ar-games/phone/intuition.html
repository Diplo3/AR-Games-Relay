  <title>Интуиция · Игрок</title>
  <style>:root{color-scheme:dark;--background:#23101a;--surface:#321823;--deep:#190d15;--text:#fff0d5;--muted:#cdb795;--gold:#dfb96e;--edge:#8f693c}*{box-sizing:border-box}body{background:#130b12;color:var(--text);font:16px/1.45 Segoe UI,Arial,sans-serif;margin:0;-webkit-tap-highlight-color:transparent}.phone-app{background:var(--background);display:flex;flex-direction:column;margin:auto;max-width:440px;min-height:100dvh;padding-bottom:env(safe-area-inset-bottom)}.phone-header{background:linear-gradient(145deg,#491728,#1b1019);border-bottom:1px solid var(--edge);padding:22px 24px 14px;text-align:center}.phone-header img{display:block;height:65px;margin:auto;object-fit:contain;width:195px}.phone-header small{color:var(--muted);font-size:10px;letter-spacing:.12em}main{flex:1;min-width:0;padding:28px 22px}h1{font:500 27px/1.2 Georgia,serif;margin:8px 0 24px;overflow-wrap:anywhere}h1,p{text-align:center}p{font-size:14px;margin:12px 0}label,p{color:var(--muted)}label{display:grid;font-size:13px;gap:9px;margin:20px 0 16px}button,input{border:1px solid var(--edge);border-radius:9px;color:var(--text);font:inherit;width:100%}input{background:var(--deep);font-size:16px;padding:14px}button{background:var(--surface);cursor:pointer;min-height:48px;padding:14px 16px}button:disabled{cursor:default;opacity:.6}button.primary{background:linear-gradient(#efcf8b,#d8ae60);border-color:#e9c77e;color:#28180c;font-weight:600}button:focus-visible,input:focus-visible{outline:2px solid #ffe2a3;outline-offset:3px}.center{padding-top:30px;text-align:center}.emblem{background:var(--deep);border:1px solid var(--gold);border-radius:50%;box-shadow:0 0 28px #d6ae5c1c;color:var(--gold);display:grid;font:400 37px/1 Segoe UI,Arial,sans-serif;height:72px;margin:4px auto 24px;place-items:center;width:72px}.points{font:500 40px/1.2 Georgia,serif;margin:20px 0}.caption,.points{color:var(--gold);text-align:center}.caption{font-size:11px;letter-spacing:.1em;text-transform:uppercase}.facts{display:grid;gap:13px}.fact{align-items:center;background:linear-gradient(110deg,var(--surface),var(--deep));display:flex;font-size:15px;gap:12px;min-height:86px;text-align:left}.fact .letter{border:1px solid var(--edge);border-radius:50%;color:var(--gold);display:grid;flex:0 0 30px;font:500 17px Georgia,serif;height:30px;place-items:center;width:30px}.fact span:last-child,.selected{overflow-wrap:anywhere}.selected{background:var(--surface);border:1px solid var(--gold);border-radius:9px;font-size:14px;margin-top:24px;padding:16px}.ranking{list-style:none;margin:24px 0;padding:0}.ranking li{border-bottom:1px solid var(--edge);display:flex;font-size:14px;gap:14px;justify-content:space-between;padding:12px 0}.ranking b,.ranking li.mine{color:var(--gold)}.ranking b{font-weight:600}.error{color:#ffb9ac;font-size:14px;text-align:center}#player-summary{border-top:1px solid #8f693c55;color:var(--muted);display:flex;font-size:12px;gap:14px;justify-content:space-between;padding:16px 22px 22px}#player-summary:empty{display:none}#connection{background:#45202a;color:#ffe0a8;font-size:13px;margin:0;padding:10px 18px;text-align:center}[hidden]{display:none!important}@media (prefers-reduced-motion:no-preference){main{animation:appear .25s ease}@keyframes appear{0%{opacity:.6}to{opacity:1}}}</style>
