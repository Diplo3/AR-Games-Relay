<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Игрок — AR Games Quiz</title><link rel="stylesheet" href="style.css"><style id="ar-phone-touch-guard">html,body{touch-action:pan-x pan-y;overscroll-behavior:none}*{-webkit-tap-highlight-color:transparent!important;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}input,textarea,[contenteditable="true"]{-webkit-user-select:text;user-select:text}button,a,[role="button"]{-webkit-appearance:none;appearance:none;touch-action:none}button{overflow:hidden;isolation:isolate}button::before,button::after{border-radius:inherit}button:focus:not(:focus-visible),a:focus:not(:focus-visible),[role="button"]:focus:not(:focus-visible){outline:none!important}</style><script id="ar-phone-gesture-guard">(()=>{const stop=e=>{if(e.cancelable)e.preventDefault()};for(const type of ['gesturestart','gesturechange'])document.addEventListener(type,stop,{passive:false,capture:true});for(const type of ['touchstart','touchmove'])document.addEventListener(type,e=>{if(e.touches.length>1)stop(e)},{passive:false,capture:true});document.addEventListener('wheel',e=>{if(e.ctrlKey)stop(e)},{passive:false,capture:true});document.addEventListener('selectstart',e=>{if(!e.target.closest('input,textarea,[contenteditable="true"]'))stop(e)});})();</script>
</head>
<body><main class="shell phone"><header><a href="#" class="brand" style="text-decoration:none;color:inherit">AR GAMES <span>QUIZ</span></a><span id="connection" class="badge" role="status">Не подключено</span></header>
<section id="join" class="card"><div class="eyebrow">Ваш телефон — игровой пульт</div><h1>Присоединиться</h1><form id="join-form"><label>Как вас зовут?<input id="name" maxlength="32" required autocomplete="nickname" placeholder="Имя или название команды"></label><div class="row" style="margin:16px 0"><label>Комната<input id="room" minlength="4" maxlength="8" pattern="[A-Za-z0-9]{4,8}" required autocomplete="off"></label><label>Команда<select id="team"></select></label></div><button type="submit" style="width:100%">Войти в игру</button></form></section>
<div id="error" class="notice error hidden" role="alert"></div><section id="game" class="hidden"><div class="row" style="justify-content:space-between;margin-bottom:12px"><span id="identity" class="badge"></span><span id="timer" class="timer"></span></div><article class="card"><div id="phase" class="eyebrow">Ожидание ведущего</div><h1 id="title">Вы в игре!</h1><div id="question-area"></div><form id="answer-form"><fieldset id="answer-input" style="border:0;margin:0;padding:0"></fieldset><button id="submit" class="hidden" type="submit" style="width:100%;margin-top:16px">Отправить ответ</button></form><div id="answer-status" class="notice hidden" role="status" aria-live="polite"></div><div class="row"><span id="balance" class="badge">0 баллов</span><span id="question-count" class="muted"></span></div></article><article id="results-card" class="card hidden"><h2>Рейтинг</h2><div id="leaderboard"></div><div id="poll-results"></div></article></section><p class="footer-note">Если связь прервётся, телефон подключится снова. Запоздавший ответ не переносится на другой вопрос.</p></main>
<script src="shared.js"></script><script src="connect.js"></script><script src="player.js"></script></body></html>
