async function send(data){

    return{queued:true};
  }
  if(data.type==='heartbeat')return{ok:true};
  const actions={join:'snowball.join',reserve:'snowball.reserve',throw:'snowball.throw',leave:'snowball.leave'};
  if(!actions[data.type]||!relay.sendCommand(actions[data.type],{...data,round:state?.round}))throw Error('Не удалось отправить действие');

    const timer=setTimeout(()=>{throwConfirmation=null;reject(Error('Бросок не подтверждён'));},5000);
    throwConfirmation={resolve,reject,timer,round:state?.round,used:state?.player?.throwsUsed||0};
  });

}
