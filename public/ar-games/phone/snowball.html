function parsePath(value){return value.match(/[A-Za-z]|[-+]?(?:\d*\.)?\d+(?:[eE][-+]?\d+)?/g)||[];}
function rotateTokens(tokens,degrees){const out=tokens.slice(),ids=[];for(let i=0;i<tokens.length;i++)if(!/^[A-Za-z]$/.test(tokens[i]))ids.push(i);const rad=degrees*Math.PI/180,c=Math.cos(rad),sn=Math.sin(rad);for(let i=0;i<ids.length;i+=2){const xi=ids[i],yi=ids[i+1],x=Number(tokens[xi])-150,y=Number(tokens[yi])-140;out[xi]=String(150+x*c-y*sn);out[yi]=String(140+x*sn+y*c);}return out;}
function setOrbit(angle){if(refs.arrowGroup)refs.arrowGroup.style.transform='rotate('+angle+'deg)';}
function morphArrows(ready){if(morphFrame)cancelAnimationFrame(morphFrame);if(orbitFrame)cancelAnimationFrame(orbitFrame);orbitRunning=false;const paths=[...refs.arrows],from=paths.map(path=>parsePath(path.getAttribute('d'))),curve=paths.map(path=>parsePath(path.dataset.curve)),final=paths.map(path=>parsePath(path.dataset.ready));const interpolate=(a,b,t)=>a.map((v,i)=>/^[A-Za-z]$/.test(v)?v:String(Number(v)+(Number(b[i])-Number(v))*t)),write=values=>paths.forEach((path,i)=>path.setAttribute('d',values[i].join(' ')));zone.classList.remove('morphed');if(ready){const startAngle=orbitAngle,endAngle=startAngle+82,started=performance.now();setOrbit(startAngle);const follow=now=>{const t=Math.min(1,(now-started)/560),e=t*t*(3-2*t);setOrbit(startAngle+82*e);if(t<1)morphFrame=requestAnimationFrame(follow);else{const localFinal=final.map(path=>rotateTokens(path,-endAngle)),shapeFrom=paths.map(path=>parsePath(path.getAttribute('d'))),shapeStart=performance.now();const straighten=now=>{const p=Math.min(1,(now-shapeStart)/680),q=p*p*(3-2*p);write(shapeFrom.map((path,i)=>interpolate(path,localFinal[i],q)));if(p<1)morphFrame=requestAnimationFrame(straighten);else{write(final);setOrbit(0);orbitAngle=0;morphFrame=0;zone.classList.add('morphed');}};morphFrame=requestAnimationFrame(straighten);}};morphFrame=requestAnimationFrame(follow);}else{setOrbit(0);const started=performance.now(),restore=now=>{const t=Math.min(1,(now-started)/720),e=t*t*(3-2*t);write(from.map((path,i)=>interpolate(path,curve[i],e)));if(t<1)morphFrame=requestAnimationFrame(restore);else{write(curve);setOrbit(0);orbitAngle=0;morphFrame=0;startOrbit();}};morphFrame=requestAnimationFrame(restore);}}
function startOrbit(){if(orbitRunning)return;orbitRunning=true;let last=performance.now();const tick=now=>{if(!orbitRunning)return;orbitAngle=(orbitAngle+(now-last)*360/9000)%360;last=now;setOrbit(orbitAngle);orbitFrame=requestAnimationFrame(tick);};orbitFrame=requestAnimationFrame(tick);}
function render(){if(!state)return;const counts=state.counts||{blue:30,red:30},ready=state.ball?.state==='READY_HELD'||state.player?.ready,phase=state.phase,waiting=phase==='LOBBY',active=['COUNTDOWN','PLAYING','CLOSING','RESOLVING','RESULTS'].includes(phase);refs.blue.textContent=counts.blue;refs.red.textContent=counts.red;if(state.teamNames){refs.blueLabel.textContent=state.teamNames.blue||'СИНИЕ';refs.redLabel.textContent=state.teamNames.red||'КРАСНЫЕ';}const left=Math.max(0,Math.ceil(state.remaining||0));refs.clock.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');if(state.ball?.id)lastObservedBallId=state.ball.id;else if(lastObservedBallId&&!gesture&&!throwing){localProgress=0;lastObservedBallId=null;}if(!active)localProgress=0;const progress=Math.max(localProgress,Number(state.ball?.progress||0)),percent=Math.min(100,progress/(Math.PI*5)*100);refs.arc.style.strokeDashoffset=String(465*(1-percent/100));screen.classList.toggle('waiting',waiting);screen.classList.toggle('ball-visible',active);refs.snowball.classList.toggle('ready',ready);zone.classList.toggle('ready',ready);zone.classList.toggle('working',!!gesture&&gesture.kind==='roll');zone.classList.toggle('throwing',throwing);refs.snowball.style.setProperty('--grow-scale',String(.38+percent/100*.62));if(ready!==lastReady){morphArrows(ready);lastReady=ready;}if(state.error){refs.title.textContent='ВНИМАНИЕ';refs.subtitle.textContent=state.error;}else if(waiting){refs.title.textContent='ЖДЁМ НАЧАЛА ИГРЫ';refs.subtitle.textContent='Раунд начнётся после старта на компьютере.';}else if(phase==='COUNTDOWN'){refs.title.textContent=String(Math.max(1,Math.ceil(state.countdown||3)));refs.subtitle.textContent='ПРИГОТОВЬТЕСЬ К ИГРЕ';}else if(state.paused){refs.title.textContent='ПАУЗА';refs.subtitle.textContent='ОЖИДАЙТЕ ПРОДОЛЖЕНИЯ';}else if(throwing){refs.title.textContent=throwConfirmation?'ПОДТВЕРЖДАЕМ БРОСОК':'БРОСОК ПРИНЯТ';refs.subtitle.textContent='СНЕЖОК ЛЕТИТ К СОПЕРНИКАМ';}else if(ready){refs.title.textContent='СНЕЖОК ГОТОВ!';refs.subtitle.innerHTML='СВАЙПНИТЕ ВВЕРХ,<br>ЧТОБЫ БРОСИТЬ';}else if(phase==='RESULTS'){refs.title.textContent='РАУНД ЗАВЕРШЁН';refs.subtitle.textContent='ОЖИДАЙТЕ НОВОГО РАУНДА';}else{refs.title.textContent='СЛЕПИ СНЕЖОК';refs.subtitle.textContent='ВЕДИ ПАЛЬЦЕМ КРУГОВЫМ ДВИЖЕНИЕМ В ЛЮБОМ МЕСТЕ ЭКРАНА';}}
function queueRoll(amount){pending+=amount;const now=performance.now();if(pending<.18||now-lastRollSend<120)return;const chunk=Math.min(.45,pending);pending-=chunk;lastRollSend=now;seq++;localProgress=Math.min(Math.PI*5,localProgress+chunk);haptic('roll');send({type:'roll',seq,radians:chunk}).catch(()=>setStatus(false));render();}
screen.addEventListener('pointerdown',event=>{if(!state||awaitingFreshState||!relay?.ready||!state.online||state.phase!=='PLAYING'||state.paused||throwing||event.target.closest('button,input,a'))return;screen.setPointerCapture?.(event.pointerId);if(state.ball?.state==='READY_HELD'||state.player?.ready){gesture={kind:'throw',id:event.pointerId,x:event.clientX,y:event.clientY,started:performance.now()};event.preventDefault();return;}gesture={kind:'roll',id:event.pointerId,lastX:event.clientX,lastY:event.clientY,lastDx:0,lastDy:0,turnDirection:0,started:performance.now()};zone.classList.add('working');haptic('roll');event.preventDefault();if(!state.ball)send({type:'reserve'}).catch(()=>setStatus(false));});
screen.addEventListener('pointermove',event=>{if(!gesture||gesture.id!==event.pointerId)return;event.preventDefault();if(gesture.kind!=='roll')return;const dx=event.clientX-gesture.lastX,dy=event.clientY-gesture.lastY,length=Math.hypot(dx,dy);gesture.lastX=event.clientX;gesture.lastY=event.clientY;if(length<4)return;if(gesture.lastDx||gesture.lastDy){const turn=Math.atan2(gesture.lastDx*dy-gesture.lastDy*dx,gesture.lastDx*dx+gesture.lastDy*dy),magnitude=Math.abs(turn),direction=Math.sign(turn);if(magnitude>.045&&magnitude<1.15){if(!gesture.turnDirection)gesture.turnDirection=direction;if(direction===gesture.turnDirection)queueRoll(magnitude);else if(magnitude>.24)gesture.turnDirection=direction;}}gesture.lastDx=dx;gesture.lastDy=dy;});
screen.addEventListener('pointerup',event=>{if(!gesture||gesture.id!==event.pointerId)return;const current=gesture;gesture=null;zone.classList.remove('working');if(current.kind==='throw'){const dy=event.clientY-current.y,dx=event.clientX-current.x;if(dy< -55&&Math.abs(dy)>Math.abs(dx)*.85){throwing=true;haptic('throw');actionId++;send({type:'throw',actionId:'phone-'+playerId+'-'+Date.now()+'-'+actionId}).then(()=>{clearTimeout(throwTimer);throwTimer=setTimeout(()=>{throwing=false;localProgress=0;render();},720);}).catch(()=>{throwing=false;setStatus(false);render();});}}else if(pending>=.02){const remainder=Math.min(.45,pending);pending=0;seq++;localProgress=Math.min(Math.PI*5,localProgress+remainder);send({type:'roll',seq,radians:remainder}).catch(()=>setStatus(false));}render();});
screen.addEventListener('pointercancel',()=>{gesture=null;zone.classList.remove('working');render();});
function tickOrbit(now){if(!orbitRunning)return;const delta=now-(tickOrbit.last||now);tickOrbit.last=now;orbitAngle=(orbitAngle+delta*360/9000)%360;setOrbit(orbitAngle);orbitFrame=requestAnimationFrame(tickOrbit);}orbitFrame=requestAnimationFrame(tickOrbit);
</script></body></html>
