.phone{min-height:100dvh;display:grid;grid-template-rows:auto 1fr;gap:12px;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));text-align:center;align-items:center}
header{display:grid;justify-items:center;gap:6px}.brand{display:block;width:min(70vw,245px);height:auto;pointer-events:none;-webkit-user-drag:none}
#connection{margin:0;font-size:13px;color:#e4d1ff}#connection::before{content:"";display:inline-block;width:.55em;height:.55em;margin-right:.45em;border-radius:50%;background:#e5bdff}
#connection[data-state=online]::before{background:#a8f4ce}#connection[data-state=offline]::before{background:#ff99b9}
#phone{width:min(100%,520px);min-width:0;margin:auto;display:grid;gap:10px;justify-items:center}
h1,p{margin:0;max-width:100%;overflow-wrap:anywhere}h1{font-size:clamp(18px,5vw,32px);line-height:1.12}.identity{max-width:100%;display:grid;gap:4px}.identity small,.status{color:#e8d3ff}
button{font:inherit;touch-action:pan-y;color:#fff;background:#391d58;border:1px solid #cda4e999;border-radius:10px;padding:8px 12px;max-width:100%;overflow-wrap:anywhere}
button:disabled:not(.buzz){opacity:.52}.teams{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}nav{display:flex;align-items:center;gap:10px}
.buzz{container-type:inline-size;display:grid;place-items:center;width:min(62vw,34dvh,220px);aspect-ratio:1;border-radius:50%;border:2px solid #e6a4ff;padding:0;
 background:radial-gradient(ellipse at 34% 16%,#ffc4ff 0,transparent 38%),linear-gradient(150deg,#dd6df3,#912ccd 58%,#5b218d);
 box-shadow:inset 0 5px 8px #fff5,inset 0 -8px 13px #340a6860,0 8px 0 #3d125e,0 13px 22px #1d092d9c;cursor:pointer}
.buzz span{width:76%;text-align:center;font-size:13cqw;font-weight:900;line-height:1;letter-spacing:.01em}
.buzz:enabled:active{transform:translateY(4px);box-shadow:inset 0 3px 8px #fff5,0 4px 0 #3d125e}
.buzz:disabled{filter:saturate(.42);cursor:default}.status{font-size:14px;padding-top:6px}
@media(orientation:landscape){.phone{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);grid-template-rows:auto;gap:14px}.brand{width:min(34vw,230px)}.buzz{width:min(38vw,49dvh,220px)}h1{font-size:clamp(16px,7dvh,30px)}}

<script src="connect.js"></script><script>const cancelCaptainGesture=event=>{if(event.cancelable)event.preventDefault()};
for(const type of ['gesturestart','gesturechange','gestureend','dblclick','contextmenu','selectstart','dragstart']){
 document.addEventListener(type,cancelCaptainGesture,{passive:false});
}
for(const type of ['touchstart','touchmove']){
 document.addEventListener(type,event=>{if(event.touches.length>1)cancelCaptainGesture(event)},{passive:false});
}

const captainView=(()=>{
 const status=document.querySelector('#connection');
 const view=document.querySelector('#phone');
 let markup='';
 const escape=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]);
 return {
  connection(text,kind){if(status.textContent!==text)status.textContent=text;status.dataset.state=kind},
  show(html){if(html!==markup){view.innerHTML=html;markup=html}},
  escape,
  round(name,button,message,enabled){
   return '<div class="identity"><small>Команда</small><h1>'+escape(name)+'</h1></div><button class="buzz" data-buzz '+(enabled?'':'disabled')+'><span>'+escape(button)+'</span></button><p class="status">'+escape(message)+'</p>';
  }
 };
})();

(() => {
 const room=new URLSearchParams(location.search).get('room');
 const view=document.querySelector('#phone');
 if(!room){captainView.connection('Комната не указана','offline');captainView.show('<p>Откройте QR-код ведущего.</p>');return}
 const key='shazam-relay:'+room;
 const clientId=localStorage.getItem(key)||crypto.randomUUID();
 localStorage.setItem(key,clientId);
 let connected=false, hostOnline=false, everConnected=false, state, team, pending=false, error='', page=0;
 const escape=captainView.escape;
 function render(){
  const ready=connected&&hostOnline&&state;
  if(ready)everConnected=true;
  captainView.connection(ready?'Подключено через интернет':everConnected?'Связь потеряна · переподключаемся':connected?'Ожидаем ведущего…':'Подключаемся через интернет…',ready?'online':everConnected?'offline':'pending');
  if(!ready){captainView.show('<p>Ожидаем связь с ведущим…</p>');return}
  const name=team&&state.names[team-1];
  let html;
  if(!name){
   const last=Math.max(0,Math.ceil(state.names.length/6)-1);
   page=Math.min(page,last);
   html='<h1>Выберите команду</h1><div class="teams">'+state.names.slice(page*6,page*6+6).map((item,index)=>{
    const id=page*6+index+1;
    return '<button data-team="'+id+'" '+(state.taken.includes(id)||pending?'disabled':'')+'>'+escape(item)+'</button>';
   }).join('')+'</div>'+(last?'<nav><button data-page="'+(page-1)+'" aria-label="Назад" '+(!page?'disabled':'')+'>‹</button><span>'+(page+1)+' / '+(last+1)+'</span><button data-page="'+(page+1)+'" aria-label="Далее" '+(page===last?'disabled':'')+'>›</button></nav>':'');
  }else{
   const first=state.winner===team;
   html=captainView.round(name,first?'ПЕРВЫЕ':state.active?'ЗНАЮ':'ЖДИТЕ',first?'Вы нажали первыми':state.winner?state.names[state.winner-1]+' ответил быстрее':state.active?'Можно отвечать':'Ожидаем следующий трек',state.active&&!pending);
  }
  captainView.show(html+(error?'<p>'+escape(error)+'</p>':''));
 }
 const client=new ARConnect.Client({room,role:'player',clientId,team:1,gameId:'ar-games-bystree-shazama',
  onState(status){connected=status==='Подключено';pending=false;render()},
  onEvent(event){if(event.type==='room_stats'){hostOnline=!!event.hostOnline;render()}},
  onGameState(event){
   if(!event.state)return;
   if(event.clientId){team=event.state.team;error=event.state.error||'';pending=false}
   else{if(state?.round!==event.state.round||event.state.winner)pending=false;state=event.state;if(state.reset)team=null}
   render();
  }
 });
 view.addEventListener('click',event=>{
  const button=event.target.closest('button');
  if(!button||button.disabled||!connected||!hostOnline||pending)return;
  if(button.dataset.page!==undefined){page=Number(button.dataset.page);render();return}
  const buzz=button.hasAttribute('data-buzz');
  if(buzz)navigator.vibrate?.(45);
  pending=client.sendCommand(buzz?'shazam.buzz':'shazam.join',buzz?{round:state.round}:{team:Number(button.dataset.team)});
  if(pending)setTimeout(()=>{if(pending){pending=false;render()}},3500);
  render();
 });
 client.start();
 addEventListener('beforeunload',()=>client.stop());
})();
</script>
</html>
