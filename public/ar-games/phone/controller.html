<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>AR Games — игровой пульт</title><link rel="stylesheet" href="style.css"></head><body><main class="shell phone"><header><div class="brand"><span id="brand-main">AR GAMES</span> <span id="brand-suffix">CONNECT</span></div><span id="connection" class="badge" role="status">Не подключено</span></header><section class="card"><h1 id="screen-title">Игровой пульт</h1><form id="join-form"><label id="name-field">Имя<input id="name" maxlength="32" required autocomplete="nickname"></label><div class="row setup-row"><label>Комната<input id="room" minlength="4" maxlength="8" required autocomplete="off"></label><label>Команда<select id="team"></select></label></div><button id="join" type="submit">Подключиться</button></form><div id="error" class="notice error hidden" role="alert"></div><div id="controls" class="hidden"><div id="buttons" class="choices"></div><div id="game-message" class="notice" role="status">Ждём игру…</div><div id="sensor-buttons" class="row"></div><button id="calibrate" type="button" class="secondary hidden">Калибровать наклон</button><div id="sensor-state" class="footer-note" role="status"></div><div id="delivery" class="footer-note" role="status"></div></div></section><p id="sensor-note" class="footer-note">Датчики включаются только после вашего нажатия. Если датчик недоступен, обычные кнопки продолжают работать.</p></main><script src="shared.js"></script><script src="connect.js"></script><script src="motion.js"></script><script src="sensors.js"></script><script src="controller.js"></script></body></html>
