<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AR Games — игровой пульт</title><link rel="stylesheet" href="style.css"></head><body><main class="shell phone"><header><div class="brand">AR GAMES <span>CONNECT</span></div><span id="connection" class="badge" role="status">Не подключено</span></header><section class="card"><h1>Игровой пульт</h1><form id="join-form"><label>Имя<input id="name" maxlength="32" required></label><div class="row" style="margin:16px 0"><label>Комната<input id="room" minlength="4" maxlength="8" required></label><label>Команда<select id="team"></select></label></div><button id="join" type="submit">Подключиться</button></form><div id="error" class="notice error hidden" role="alert"></div><div id="controls" class="hidden"><div id="buttons" class="choices"></div><div id="game-message" class="notice" role="status">Ждём игру…</div><div id="sensor-buttons" class="row"></div><button id="calibrate" type="button" class="secondary hidden">Калибровать наклон</button><div id="sensor-state" class="footer-note" role="status"></div><div id="delivery" class="footer-note" role="status"></div></div></section><p class="footer-note">Датчики включаются только после вашего нажатия. Если датчик недоступен, обычные кнопки продолжают работать.</p></main><script src="shared.js"></script><script src="connect.js"></script><script src="motion.js"></script><script src="sensors.js"></script><script src="controller.js"></script></body></html>
