<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#174478"><title>Пионерский заезд · телефон</title><link rel="stylesheet" href="pioneer.css"><style id="ar-phone-touch-guard">html,body{touch-action:pan-x pan-y;overscroll-behavior:none}*{-webkit-tap-highlight-color:transparent!important;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}input,textarea,[contenteditable="true"]{-webkit-user-select:text;user-select:text}button,a,[role="button"]{-webkit-appearance:none;appearance:none;touch-action:none}button{overflow:hidden;isolation:isolate}button::before,button::after{border-radius:inherit}button:focus:not(:focus-visible),a:focus:not(:focus-visible),[role="button"]:focus:not(:focus-visible){outline:none!important}</style><script id="ar-phone-gesture-guard">(()=>{const stop=e=>{if(e.cancelable)e.preventDefault()};for(const type of ['gesturestart','gesturechange'])document.addEventListener(type,stop,{passive:false,capture:true});for(const type of ['touchstart','touchmove'])document.addEventListener(type,e=>{if(e.touches.length>1)stop(e)},{passive:false,capture:true});document.addEventListener('wheel',e=>{if(e.ctrlKey)stop(e)},{passive:false,capture:true});document.addEventListener('selectstart',e=>{if(!e.target.closest('input,textarea,[contenteditable="true"]'))stop(e)});})();</script>
</head><body><main id="phone">
<header><h1 id="title">Подключись и выбери команду</h1><span id="connection" role="status">Подключение</span></header>
<section id="join-screen" class="screen"><div class="teams"><button class="team blue" id="join-one">СИНИЕ</button><button class="team red" id="join-two">КРАСНЫЕ</button></div><p class="foot">Держи телефон горизонтально и выбери свою команду</p></section>
<section id="wait-screen" class="screen" hidden><div class="count"><small id="wait-caption">ЖДЁМ СТАРТА</small><b id="countdown">❄</b></div></section>
<section id="race-screen" class="screen" hidden><div class="steering"><div class="steer-panel"><b id="direction">↑ ДВИЖЕШЬСЯ ПРЯМО</b><div class="meter"><i id="needle"></i></div></div></div><div class="race-footer"><button id="calibrate">По центру</button></div></section>
<section id="result-screen" class="screen" hidden><div class="teams"><div class="team blue"><span id="result-one-name">СИНИЕ</span><b id="result-one">0</b></div><div class="team red"><span id="result-two-name">КРАСНЫЕ</span><b id="result-two">0</b></div></div><p class="foot">Следующий раунд запустит ведущий</p></section>
<div id="sensor-controls" hidden><button id="enable-sensor">Включить наклон</button><span id="sensor-status" role="status"></span></div></main><script src="connect.js"></script><script src="motion.js"></script><script src="sensors.js"></script><script src="pioneer.js"></script></body></html>
