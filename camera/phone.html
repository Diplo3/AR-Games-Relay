for(const type of ['gesturestart','gesturechange','gestureend','contextmenu','selectstart','dragstart','dblclick'])document.addEventListener(type,e=>e.preventDefault(),{passive:false});document.addEventListener('touchstart',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});const $=id=>document.getElementById(id),token=new URL(location.href).searchParams.get('token'),base=location.pathname.replace(/\/$/,'');let stream,timer,active=false,busy=false,wake;const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');function stop(){active=false;clearInterval(timer);stream?.getTracks().forEach(t=>t.stop());stream=null;$('preview').srcObject=null;wake?.release().catch(()=>{});$('start').disabled=false;$('status').textContent='Камера отключена';}async function frame(){if(!active||busy||!$('preview').videoWidth)return;busy=true;try{const v=$('preview');canvas.width=640;canvas.height=Math.round(640*v.videoHeight/v.videoWidth);ctx.drawImage(v,0,0,canvas.width,canvas.height);const blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',.72));const r=await fetch(base+'/frame?token='+encodeURIComponent(token),{method:'POST',headers:{'Content-Type':'image/jpeg'},body:blob,signal:AbortSignal.timeout(8000)});if(r.status===403){stop();$('status').textContent='Сеанс завершён. Получите новый QR-код.';}else if(r.ok)$('status').textContent='Камера подключена — изображение передаётся в игру';else throw Error();}catch{$('status').textContent='Нет связи. Пробуем подключиться снова…';}finally{busy=false;}}async function requestCamera(constraints){if(!window.isSecureContext)throw Object.assign(Error('Откройте защищённую HTTPS-ссылку из QR-кода'),{name:'SecurityError'});if(!navigator.mediaDevices?.getUserMedia){const legacy=navigator.getUserMedia||navigator.webkitGetUserMedia||navigator.mozGetUserMedia;if(legacy)return new Promise((ok,no)=>legacy.call(navigator,constraints,ok,no));throw Object.assign(Error('Этот встроенный браузер не предоставляет камеру. Откройте ссылку в основном браузере телефона.'),{name:'NotSupportedError'});}try{return await navigator.mediaDevices.getUserMedia(constraints);}catch(e){if(e.name==='OverconstrainedError'||e.name==='NotFoundError')return navigator.mediaDevices.getUserMedia({audio:false,video:true});throw e;}}async function start(){stop();$('start').disabled=true;try{stream=await requestCamera({audio:false,video:{facingMode:{ideal:$('facing').value},width:{ideal:640},height:{ideal:480},frameRate:{ideal:10}}});$('preview').srcObject=stream;await $('preview').play();active=true;try{screen.orientation?.lock?.('portrait').catch(()=>{});}catch{}try{wake=await navigator.wakeLock?.request('screen');}catch{}timer=setInterval(frame,160);frame();}catch(e){stop();$('status').textContent=e.name==='NotSupportedError'||e.name==='SecurityError'?e.message:e.name==='NotAllowedError'?'Доступ к камере запрещён. Нажмите значок настроек слева от адреса сайта, разрешите камеру и повторите. Если открыто окно сканера QR, откройте ссылку в основном браузере.':'Не удалось открыть камеру. Закройте другие приложения камеры и повторите.';}}new MutationObserver(()=>{$('connection-status').textContent=active?'Камера подключена':'Камера не подключена';$('connection-status').classList.toggle('connected',active);$('status').hidden=active;}).observe($('status'),{childList:true,subtree:true});for(const [id,value]of [['front','user'],['back','environment']])$(id).onclick=()=>{$('facing').value=value;for(const k of ['front','back'])$(k).classList.toggle('active',k===id);if(active)start();};$('start').onclick=start;$('stop').onclick=stop;$('facing').onchange=()=>{if(active)start();};window.addEventListener('pagehide',stop);
