<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Камера смеха</title><style>body{background:#081326;color:#f4f7ff;font:16px system-ui;margin:0;padding:20px;max-width:600px;margin:auto}h1{text-align:center}video{width:100%;height:55vh;object-fit:contain;background:#020611;border-radius:22px}.actions{display:flex;gap:12px;margin-top:16px}button,select{padding:14px;border:1px solid #a8d4ff77;border-radius:16px;color:white;background:#194e7d;font:inherit;flex:1}#status{text-align:center;line-height:1.5}button:disabled{opacity:.5}</style><h1>Камера смеха</h1><p>Подключите камеру и оставьте эту страницу открытой.</p><video id="preview" autoplay muted playsinline></video><div class="actions"><button id="start">Подключить камеру</button><button id="stop">Отключить</button></div><div class="actions"><select id="facing"><option value="user">Передняя камера</option><option value="environment">Задняя камера</option></select></div><p id="status">Нажмите «Подключить камеру»</p><script>
const $=id=>document.getElementById(id),token=new URL(location.href).searchParams.get('token'),base=location.pathname.replace(/\/$/,'');let stream,timer,active=false,busy=false,wake;const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');function stop(){active=false;clearInterval(timer);stream?.getTracks().forEach(t=>t.stop());stream=null;$('preview').srcObject=null;wake?.release().catch(()=>{});$('start').disabled=false;$('status').textContent='Камера отключена';}async function frame(){if(!active||busy||!$('preview').videoWidth)return;busy=true;try{const v=$('preview');canvas.width=640;canvas.height=Math.round(640*v.videoHeight/v.videoWidth);ctx.drawImage(v,0,0,canvas.width,canvas.height);const blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',.72));const r=await fetch(base+'/frame?token='+encodeURIComponent(token),{method:'POST',headers:{'Content-Type':'image/jpeg'},body:blob,signal:AbortSignal.timeout(8000)});if(r.status===403){stop();$('status').textContent='Сеанс завершён. Получите новый QR-код.';}else if(r.ok)$('status').textContent='Камера подключена — изображение передаётся в игру';else throw Error();}catch{$('status').textContent='Нет связи. Пробуем подключиться снова…';}finally{busy=false;}}async function start(){stop();$('start').disabled=true;try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:$('facing').value},width:{ideal:640},height:{ideal:480},frameRate:{ideal:10}}});$('preview').srcObject=stream;await $('preview').play();active=true;try{wake=await navigator.wakeLock?.request('screen');}catch{}timer=setInterval(frame,160);frame();}catch(e){stop();$('status').textContent=e.name==='NotAllowedError'?'Разрешите доступ к камере в браузере и нажмите подключить.':'Не удалось открыть камеру. Закройте другие приложения камеры и повторите.';}}$('start').onclick=start;$('stop').onclick=stop;$('facing').onchange=()=>{if(active)start();};window.addEventListener('pagehide',stop);
</script></html>
